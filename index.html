<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BC Project</title>
    <link rel="stylesheet" href="style.css">
    <script src="translations.js"></script>
</head>
<body>
<div id="world-settings">
    <button id="world-settings-btn" aria-label="Ayarlar">
        ⚙
    </button>

    <div id="world-settings-menu">
        <h3 world-data="settings">Ayarlar</h3>

        <label world-data="language">Dil</label>
        <select id="world-language">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
        </select>

        <label world-data="theme">Tema</label>
        <select id="world-theme">
            <option value="light">Açık</option>
            <option value="dark">Koyu</option>
        </select>
    </div>
</div>
</body>
</html>
